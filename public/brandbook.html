<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrandBook Studio — Northwind Brand Guidelines</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.263.1/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<style>
:root{
  --ink:#14161a;--ink2:#3d434e;--mut:#6f7683;--faint:#9aa1ad;
  --paper:#f3f1ec;--surface:#ffffff;--raise:#fbfaf7;--sunk:#eeebe4;
  --line:#e3e0d8;--line2:#d3cfc4;--scrim:rgba(20,22,26,.44);
  --blue:#2e5bff;--blueSoft:#edf1ff;--blueDeep:#1b3ecb;
  --verm:#e8452c;--vermSoft:#fdeeeb;
  --amber:#d98407;--amberSoft:#fdf4e5;
  --emer:#0d9464;--emerSoft:#e8f7f1;
  --violet:#7c3aed;--magenta:#db2777;
  --r:8px;--ui:'Inter',system-ui,-apple-system,sans-serif;
  --sh1:0 1px 2px rgba(20,22,26,.05);
  --sh2:0 4px 14px -6px rgba(20,22,26,.18),0 1px 3px rgba(20,22,26,.06);
  --sh3:0 18px 44px -14px rgba(20,22,26,.34),0 3px 10px -4px rgba(20,22,26,.14);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--ui);color:var(--ink);background:var(--paper);font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:var(--sunk)}
::-webkit-scrollbar-thumb{background:var(--line2);border:3px solid var(--sunk);border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:var(--blue)}
::-webkit-scrollbar-corner{background:var(--sunk)}
*{scrollbar-width:thin;scrollbar-color:var(--line2) var(--sunk)}
.ic{display:inline-flex;align-items:center;justify-content:center;flex:none}
.ic svg{width:15px;height:15px;stroke-width:1.9}
.ic.sm svg{width:13px;height:13px}
.ic.xs svg{width:11px;height:11px}

/* ─── primitives ─── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line2);background:var(--surface);border-radius:var(--r);padding:0 12px;height:34px;cursor:pointer;font-weight:600;font-size:12.5px;transition:background .14s,border-color .14s,box-shadow .14s,transform .06s;white-space:nowrap}
.btn:hover{background:var(--raise);border-color:var(--faint)}
.btn:active{transform:translateY(1px)}
.btn.p{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.p:hover{background:#000}
.btn.a{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 2px 10px -4px rgba(46,91,255,.6)}
.btn.a:hover{background:var(--blueDeep);border-color:var(--blueDeep)}
.btn.dgr{color:var(--verm);border-color:#f6cdc5}
.btn.dgr:hover{background:var(--vermSoft);border-color:var(--verm)}
.btn.sm{height:28px;padding:0 9px;font-size:11.5px;border-radius:7px}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}
.ib{border:1px solid transparent;background:none;cursor:pointer;height:30px;width:30px;border-radius:7px;color:var(--mut);display:inline-flex;align-items:center;justify-content:center;transition:background .14s,color .14s,border-color .14s}
.ib:hover{background:var(--sunk);color:var(--ink)}
.ib:disabled{opacity:.3;cursor:not-allowed}
.inp,.ta{border:1px solid var(--line2);border-radius:var(--r);padding:8px 10px;background:var(--surface);width:100%;font-weight:400;font-size:13px;transition:border-color .14s,box-shadow .14s}
.ta{resize:vertical;min-height:70px;line-height:1.55}
.inp:hover,.ta:hover{border-color:var(--faint)}
.inp:focus,.ta:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blueSoft)}
.inp::placeholder,.ta::placeholder{color:var(--faint)}
.fld{display:flex;flex-direction:column;gap:6px}
.lbl{font-size:10.5px;font-weight:700;color:var(--ink2);letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;gap:8px}
.lbl b{color:var(--blue);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:0;font-size:11px}
.sep{height:1px;background:var(--line);border:0;margin:2px 0}
.badge{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:99px;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.badge.b{background:var(--blueSoft);color:var(--blueDeep)}
.badge.g{background:var(--emerSoft);color:var(--emer)}
.badge.a{background:var(--amberSoft);color:#8a5a06}

.ctl{display:block;width:100%}
.trg{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;height:34px;padding:0 10px;border:1px solid var(--line2);border-radius:var(--r);background:var(--surface);font-size:13px;font-weight:500;cursor:pointer;text-align:left;transition:border-color .14s,box-shadow .14s,background .14s}
.trg:hover{border-color:var(--faint);background:var(--raise)}
.trg[aria-expanded=true]{border-color:var(--blue);box-shadow:0 0 0 3px var(--blueSoft)}
.trg .v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.trg .cv{color:var(--mut);transition:transform .18s}
.trg[aria-expanded=true] .cv{transform:rotate(180deg)}
.trg .sw{width:16px;height:16px;border-radius:4px;border:1px solid rgba(0,0,0,.14);flex:none}
.trg .mono{font-variant-numeric:tabular-nums;letter-spacing:.02em}

.pop{position:fixed;z-index:2400;background:var(--surface);border:1px solid var(--line2);border-radius:11px;box-shadow:var(--sh3);padding:5px;animation:pin .15s cubic-bezier(.2,.9,.3,1.05);overflow:auto;overscroll-behavior:contain}
@keyframes pin{from{opacity:0;transform:translateY(-5px) scale(.985)}to{opacity:1;transform:none}}
.opt{display:flex;align-items:center;gap:9px;min-height:32px;padding:5px 8px;border-radius:7px;font-size:13px;cursor:pointer;color:var(--ink2);transition:background .1s}
.opt[data-a=true]{background:var(--sunk);color:var(--ink)}
.opt[data-s=true]{color:var(--blueDeep);font-weight:650}
.opt .ck{margin-left:auto;color:var(--blue);opacity:0}
.opt[data-s=true] .ck{opacity:1}
.opt .dot{width:14px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.14);flex:none}
.opt small{display:block;color:var(--mut);font-size:10.5px;font-weight:400;margin-top:1px}
.pop .gh{padding:7px 8px 4px;font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.cbb-search{display:flex;align-items:center;gap:7px;padding:5px 8px 8px;border-bottom:1px solid var(--line);margin-bottom:4px;position:sticky;top:-5px;background:var(--surface);z-index:2}
.cbb-search input{border:0;outline:none;flex:1;font-size:13px;background:none;padding:2px 0}

.sld{padding:8px 0 4px}
.sld-t{position:relative;height:6px;border-radius:99px;background:var(--sunk);cursor:pointer;box-shadow:inset 0 0 0 1px rgba(20,22,26,.05)}
.sld-r{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--violet))}
.sld-h{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#fff;border:2px solid var(--blue);box-shadow:0 1px 5px rgba(20,22,26,.28);cursor:grab;transition:transform .12s}
.sld-t:hover .sld-h{transform:scale(1.12)}
.sld-h:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.sld.drag .sld-h{cursor:grabbing;transform:scale(1.18)}

.swt{width:38px;height:22px;border-radius:99px;background:var(--line2);border:0;position:relative;cursor:pointer;transition:background .2s;flex:none;padding:0}
.swt[data-state=on]{background:var(--blue)}
.swt::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s cubic-bezier(.2,.9,.3,1.25)}
.swt[data-state=on]::after{transform:translateX(16px)}
.swt:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;font-weight:600;color:var(--ink2)}

.cb{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--line2);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0;transition:all .14s;color:#fff}
.cb:hover{border-color:var(--blue)}
.cb[data-state=on]{background:var(--blue);border-color:var(--blue)}
.cb .ic{opacity:0;transform:scale(.6);transition:all .14s}
.cb[data-state=on] .ic{opacity:1;transform:none}
.cb:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.cp{width:250px;padding:3px}
.cp-sv{position:relative;height:134px;border-radius:8px;cursor:crosshair;overflow:hidden;border:1px solid var(--line);touch-action:none}
.cp-cur{position:absolute;width:15px;height:15px;margin:-7.5px 0 0 -7.5px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.4),0 1px 4px rgba(0,0,0,.3);pointer-events:none}
.cp-hue{position:relative;height:13px;margin-top:9px;border-radius:99px;background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);cursor:pointer;touch-action:none;border:1px solid rgba(0,0,0,.08)}
.cp-ht{position:absolute;top:50%;width:15px;height:15px;margin:-7.5px 0 0 -7.5px;border-radius:50%;background:#fff;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 1px 3px rgba(0,0,0,.25);pointer-events:none}
.cp-row{display:flex;align-items:center;gap:7px;margin-top:10px}
.cp-row span{font-size:9.5px;font-weight:800;letter-spacing:.08em;color:var(--faint)}
.cp-row input{flex:1;border:1px solid var(--line2);border-radius:6px;padding:5px 7px;font-size:12px;font-variant-numeric:tabular-nums;text-transform:uppercase;outline:none}
.cp-row input:focus{border-color:var(--blue);box-shadow:0 0 0 2px var(--blueSoft)}
.cp-sw{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-top:9px}
.cp-sw button{aspect-ratio:1;border-radius:5px;border:1px solid rgba(0,0,0,.13);cursor:pointer;padding:0;transition:transform .12s}
.cp-sw button:hover{transform:scale(1.16)}
.cp-meta{margin-top:9px;padding-top:8px;border-top:1px solid var(--line);font-size:9.5px;color:var(--mut);line-height:1.65;font-variant-numeric:tabular-nums}

.tip{position:fixed;z-index:2600;background:var(--ink);color:#fff;font-size:11px;font-weight:600;padding:5px 9px;border-radius:6px;pointer-events:none;box-shadow:var(--sh2);animation:pin .12s;max-width:230px;line-height:1.4}
.ovl{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(4px);z-index:2500;display:grid;place-items:start center;padding:12vh 20px 20px;animation:fin .16s}
@keyframes fin{from{opacity:0}to{opacity:1}}
.dlg{width:min(430px,94vw);background:var(--surface);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--sh3);padding:20px;animation:din .2s cubic-bezier(.2,.9,.3,1.08)}
@keyframes din{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.dlg h3{margin:0 0 7px;font-size:16px;font-weight:800;letter-spacing:-.01em}
.dlg p{margin:0 0 17px;font-size:13px;color:var(--mut);line-height:1.6}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end}
.cmdk{width:min(620px,94vw);background:var(--surface);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--sh3);overflow:hidden;animation:din .2s cubic-bezier(.2,.9,.3,1.08)}
.cmdk-top{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line)}
.cmdk-top input{border:0;outline:none;flex:1;font-size:15px;background:none}
.cmdk-list{max-height:min(420px,54vh);overflow:auto;padding:6px}
.cmdk-list .opt{min-height:36px}
.cmdk-foot{padding:8px 14px;border-top:1px solid var(--line);background:var(--raise);font-size:10.5px;color:var(--mut);display:flex;gap:14px}
.kbd{display:inline-block;padding:1px 5px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;background:var(--surface);font-size:10px;font-weight:700;color:var(--ink2)}

/* ─── shell ─── */
.app{display:flex;height:100%}
.side{width:378px;flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;height:100%}
.sh{padding:16px 20px 0;border-bottom:1px solid var(--line);background:var(--surface)}
.brow{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.mk{width:34px;height:34px;border-radius:9px;background:var(--ink);display:grid;place-items:center;flex:none;box-shadow:0 3px 10px -3px rgba(20,22,26,.5)}
.mk svg{width:18px;height:18px}
.sh h1{font-size:16px;margin:0;font-weight:800;letter-spacing:-.025em}
.sh p{margin:2px 0 0;color:var(--mut);font-size:11px}
.sh .kk{margin-left:auto}
.tabs{display:flex;gap:1px;margin:0 -8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;padding:9px 11px;font-size:12.5px;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;font-weight:600;white-space:nowrap;transition:color .14s,border-color .14s}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-color:var(--ink)}
.tab.sl{color:var(--blue)}
.tab.sl.on{border-color:var(--blue)}
.sb{overflow:auto;padding:18px 20px 24px;flex:1;min-height:0}
.pn{display:none;flex-direction:column;gap:14px}
.pn.on{display:flex}
.note{margin:0;font-size:11.5px;color:var(--mut);line-height:1.6}
.hd{font-size:10px;font-weight:800;display:flex;justify-content:space-between;align-items:center;text-transform:uppercase;letter-spacing:.09em;color:var(--ink2)}
.row{display:flex;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}

.slots{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.slot{border:1px dashed var(--line2);border-radius:9px;padding:9px;cursor:pointer;transition:border-color .14s,background .14s;background:none;text-align:left}
.slot.has{border-style:solid;border-color:var(--line);background:var(--raise)}
.slot:hover{border-color:var(--blue);background:var(--blueSoft)}
.slot .th{height:52px;display:flex;align-items:center;justify-content:center;background:var(--surface);border-radius:6px;margin-bottom:7px;color:var(--faint);border:1px solid var(--line)}
.slot .th img{max-width:86%;max-height:40px;object-fit:contain}
.slot b{display:block;font-weight:700;font-size:11px}
.slot span{color:var(--mut);font-size:10px}
.crow{border:1px solid var(--line);border-radius:9px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--raise)}
.vals{font-size:9.5px;color:var(--mut);display:flex;gap:5px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.vals span{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.rrow{display:flex;align-items:center;gap:7px}
.rimg{width:34px;height:34px;border:1px dashed var(--line2);border-radius:7px;background:var(--surface);cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;padding:0;overflow:hidden;color:var(--faint);transition:all .14s}
.rimg:hover{border-color:var(--blue);color:var(--blue)}
.rimg img{width:100%;height:100%;object-fit:contain}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line2);background:var(--surface);border-radius:99px;padding:4px 10px;font-size:11px;cursor:pointer;color:var(--mut);transition:all .14s}
.chip:hover{color:var(--blueDeep);border-color:var(--blue);background:var(--blueSoft)}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tcard{display:flex;align-items:center;gap:4px;border:1px solid var(--line2);background:var(--surface);border-radius:9px;padding:8px;cursor:pointer;font-size:11.5px;transition:all .14s}
.tcard:hover{border-color:var(--faint)}
.tcard.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue);background:var(--blueSoft)}
.tcard i{width:12px;height:12px;border:1px solid rgba(0,0,0,.13);border-radius:3px;flex:none}
.tcard b{margin-left:4px;font-weight:700}
.srow{display:flex;gap:9px;align-items:center;padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;background:var(--surface);transition:background .14s;cursor:pointer}
.srow:hover{background:var(--raise)}
.srow em{font-style:normal;color:var(--faint);width:24px;font-size:10.5px;font-weight:800;font-variant-numeric:tabular-nums}
.srow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slist{display:flex;flex-direction:column;gap:4px}

.db{border-top:1px solid var(--line);background:linear-gradient(178deg,var(--raise),var(--sunk));padding:12px 16px 14px;flex:none}
.db h5{margin:0 0 10px;font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);display:flex;justify-content:space-between;align-items:center}
.db h5 em{font-style:normal;color:var(--emer);font-weight:700;letter-spacing:.02em;display:inline-flex;align-items:center;gap:5px;text-transform:none;font-size:10px}
.db h5 em::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--emer);box-shadow:0 0 0 3px var(--emerSoft)}
.dbg{display:grid;grid-template-columns:1fr 1fr;gap:8px 11px}
.dbg .full{grid-column:1/-1}
.dbg .fld{gap:4px}
.dbg .lbl{font-size:9px;letter-spacing:.06em}
.dbg .trg{height:29px;font-size:11.5px;border-radius:7px}
.dbg .sld{padding:6px 0 2px}
.dbb{display:flex;gap:7px;margin-top:11px}
.dbb .btn{flex:1;height:30px;font-size:11.5px}

.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 22px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 13px;cursor:pointer;font-weight:650;font-size:12.5px;color:var(--mut);border-radius:7px;transition:all .16s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh1)}
.nav{display:none;align-items:center;gap:4px;margin-left:10px;font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.nav.on{display:inline-flex}
.nav span{min-width:62px;text-align:center;font-weight:600}
.stage{flex:1;overflow:auto;padding:26px 26px 64px;background:
  radial-gradient(1100px 460px at 88% -12%,rgba(46,91,255,.075),transparent 62%),
  radial-gradient(820px 460px at -8% 108%,rgba(232,69,44,.055),transparent 58%),
  radial-gradient(760px 420px at 46% 52%,rgba(124,58,237,.032),transparent 70%),var(--paper)}
.deck{max-width:1060px;margin:0 auto;display:grid;gap:26px}
.empty{padding:60px 30px;text-align:center;color:var(--mut);background:var(--surface);border:1px dashed var(--line2);border-radius:14px;line-height:1.7}
.s{position:relative;width:100%;aspect-ratio:16/9;background:#fff;border:1px solid var(--line);border-radius:11px;overflow:hidden;container-type:inline-size;print-color-adjust:exact;-webkit-print-color-adjust:exact;box-shadow:var(--sh1),0 12px 32px -22px rgba(20,22,26,.26);cursor:pointer;transition:border-color .16s,box-shadow .16s}
.s:hover{border-color:var(--line2)}
.s.sel{border-color:var(--blue);box-shadow:0 0 0 3px var(--blueSoft),0 12px 32px -22px rgba(20,22,26,.26)}
.s.hide{display:none}
.s.off{opacity:.34}
.snum{position:absolute;top:8px;left:8px;background:var(--scrim);color:#fff;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:6px;z-index:6;opacity:0;transition:opacity .16s;pointer-events:none;font-variant-numeric:tabular-nums;backdrop-filter:blur(5px)}
.s:hover .snum,.s.sel .snum{opacity:1}
.stb{position:absolute;top:8px;right:8px;background:var(--surface);border:1px solid var(--line2);border-radius:9px;padding:3px;display:none;gap:2px;box-shadow:var(--sh2);z-index:7}
.s.sel .stb{display:flex}
.stb button{border:0;background:none;padding:5px 8px;cursor:pointer;font-size:11px;font-weight:700;color:var(--mut);border-radius:6px;display:inline-flex;align-items:center;gap:5px}

      list.appendChild(r);rows.push(r);
    });
    function paint(){rows.forEach((r,i)=>r.dataset.a=String(i===act));const a=rows[act];if(a)a.scrollIntoView({block:'nearest'})}
    list.onkeydown=e=>{
      if(e.key==='ArrowDown'){e.preventDefault();act=(act+1)%rows.length;paint()}

      else if(e.key==='Home'){e.preventDefault();act=0;paint()}

      else if(e.key==='Enter'||e.key===' '){e.preventDefault();cfg.onChange(opts[act].value);popClose();update()}

/* ═══════════ SLIDER ═══════════ */
function Slider(host,cfg){
  if(!host)return;host.innerHTML='';host.classList.add('ctl','sld');
  const t=document.createElement('div');t.className='sld-t';
  const r=document.createElement('div');r.className='sld-r';
  const h=document.createElement('div');h.className='sld-h';h.tabIndex=0;h.setAttribute('role','slider');
  h.setAttribute('aria-valuemin',cfg.min);h.setAttribute('aria-valuemax',cfg.max);
  t.appendChild(r);t.appendChild(h);host.appendChild(t);
  const steps=Math.round((cfg.max-cfg.min)/cfg.step);
  function pct(){return (cfg.value()-cfg.min)/(cfg.max-cfg.min)}
  function update(){const p=clamp(pct(),0,1)*100;r.style.width=p+'%';h.style.left=p+'%';
    h.setAttribute('aria-valuenow',cfg.value());h.setAttribute('aria-valuetext',cfg.fmt?cfg.fmt(cfg.value()):String(cfg.value()));
    if(cfg.out){const o=$(cfg.out);if(o)o.textContent=cfg.fmt?cfg.fmt(cfg.value()):cfg.value()}}
  function setFromX(x){const b=t.getBoundingClientRect();let p=clamp((x-b.left)/b.width,0,1);
    let v=cfg.min+Math.round(p*steps)*cfg.step;v=+v.toFixed(4);
    if(v!==cfg.value()){cfg.onChange(v);update()}}
  t.addEventListener('pointerdown',e=>{e.preventDefault();DRAG=true;host.classList.add('drag');
    t.setPointerCapture(e.pointerId);setFromX(e.clientX);
    const mv=ev=>setFromX(ev.clientX);
    const up=()=>{t.removeEventListener('pointermove',mv);t.removeEventListener('pointerup',up);t.removeEventListener('pointercancel',up);
      DRAG=false;host.classList.remove('drag');if(cfg.commit)cfg.commit();afterDrag()};
    t.addEventListener('pointermove',mv);t.addEventListener('pointerup',up);t.addEventListener('pointercancel',up);
    try{h.focus({preventScroll:true})}catch(err){}});
  h.onkeydown=e=>{
    let d=0;
    if(e.key==='ArrowRight'||e.key==='ArrowUp')d=cfg.step;
    else if(e.key==='ArrowLeft'||e.key==='ArrowDown')d=-cfg.step;
    else if(e.key==='PageUp')d=cfg.step*10;
    else if(e.key==='PageDown')d=-cfg.step*10;
    else if(e.key==='Home'){e.preventDefault();cfg.onChange(cfg.min);update();if(cfg.commit)cfg.commit();return}
    else if(e.key==='End'){e.preventDefault();cfg.onChange(cfg.max);update();if(cfg.commit)cfg.commit();return}
    if(d){e.preventDefault();cfg.onChange(+clamp(cfg.value()+d,cfg.min,cfg.max).toFixed(4));update();if(cfg.commit)cfg.commit()}};
  update();UP.push(update);return{update};
}

const lucCache={},iconCache={};
function lucSVG(name,sw){const k=name+'|'+sw;if(lucCache[k]!==undefined)return lucCache[k];
  const h=document.createElement('div');h.style.cssText='position:absolute;left:-9999px;top:0';
  h.innerHTML='<i data-lucide="'+esc(name)+'"></i>';document.body.appendChild(h);icons();
  const sv=h.querySelector('svg');let o='';
  if(sv){['class','width','height'].forEach(a=>sv.removeAttribute(a));sv.setAttribute('stroke-width',sw);sv.setAttribute('xmlns',NS);o=sv.outerHTML}
  h.remove();lucCache[k]=o;return o;}
function iconNames(){return S.icons.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean).slice(0,8)}
function iconSVGFor(g,color,sw){
  const set=ICONSETS[S.iconLib]||ICONSETS.lucide;
  const key=String(g||'star').trim().toLowerCase();
  const full=set.map[key]||key;
  let svg=iconCache[set.p+':'+full]||lucSVG(ICONSETS.lucide.map[key]||key,sw);
  if(!svg)return'';
  svg=svg.replace(/currentColor/g,color);
  if(/stroke=/.test(svg))svg=svg.replace(/stroke-width="[^"]*"/,'stroke-width="'+sw+'"');
  return svg;}
function loadIconSet(){
  const set=ICONSETS[S.iconLib]||ICONSETS.lucide;
  const want=Object.keys(set.map).map(k=>set.map[k]).filter(n=>!iconCache[set.p+':'+n]);
  if(!want.length)return Promise.resolve();
  return fetch('https://api.iconify.design/'+set.p+'.json?icons='+encodeURIComponent(want.join(',')))
    .then(r=>r.ok?r.json():null)
    .then(j=>{if(!j||!j.icons)return;const dw=j.width||set.w,dh=j.height||set.h;
      Object.keys(j.icons).forEach(n=>{const o=j.icons[n],w=o.width||dw,h=o.height||dh;
        iconCache[set.p+':'+n]='<svg xmlns="'+NS+'" viewBox="0 0 '+w+' '+h+'" width="256" height="256">'+o.body+'</svg>';});})
    .catch(()=>{});}

function openCmd(){

  const box=document.createElement('div');box.className='cmdk';
  box.innerHTML='<div class="cmdk-top">'+ic('search')+'<input placeholder="Jump to a slide, panel, theme or action…" spellcheck="false"></div><div class="cmdk-list"></div><div class="cmdk-foot"><span><span class="kbd">↑</span> <span class="kbd">↓</span> navigate</span><span><span class="kbd">↵</span> run</span><span><span class="kbd">esc</span> close</span></div>';

    items=ql?all.filter(x=>(x.g+' '+x.label).toLowerCase().indexOf(ql)>=0):all;

      r.onpointerenter=()=>{act=i;paint()};

async function loadUrls(){
  const u=lines(S.uUrls).slice(0,UIDS.length);
  if(!u.length)return msg('Paste direct image URLs first (images.unsplash.com/…).');
  toast('Fetching '+u.length+' image'+(u.length===1?'':'s')+'…','info',2000);
  let ok=0,bad=0;
  for(let i=0;i<u.length;i++){
    try{
      const im=await new Promise((res,rej)=>{const m=new Image();m.crossOrigin='anonymous';m.onload=()=>res(m);m.onerror=rej;m.src=u[i]});
      const k=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight));
      const c=document.createElement('canvas');
      c.width=Math.max(2,Math.round(im.naturalWidth*k));c.height=Math.max(2,Math.round(im.naturalHeight*k));
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      S.img[UIDS[i]]=c.toDataURL('image/jpeg',.88);ok++;
    }catch(e){bad++}
  }
  pushH();refresh();
  toast('Loaded '+ok+' image'+(ok===1?'':'s')+(bad?', '+bad+' failed':''),ok?'ok':'warn',3200);
}

async function fetchWebIntelligence(topic){
  if(!topic || typeof topic !== 'string') return null;
  const clean = topic.trim().replace(/[?.,!]/g, '');
  try{
    const wikiUrl = 'https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(clean);
    const ctrl = new AbortController();
    const timeoutId = setTimeout(()=>ctrl.abort(), 3200);
    const res = await fetch(wikiUrl, { signal: ctrl.signal });
    clearTimeout(timeoutId);
    if(res.ok){
      const data = await res.json();
      if(data.extract && data.extract.length > 25){
        return {
          source: 'Wikipedia',
          title: data.title,
          url: data.content_urls ? data.content_urls.desktop.page : 'https://en.wikipedia.org/wiki/' + encodeURIComponent(data.title),
          extract: data.extract
        };
      }
    }
  }catch(e){}

  try{
    const ddgUrl = 'https://api.duckduckgo.com/?q=' + encodeURIComponent(clean) + '&format=json&no_html=1&skip_disambig=1';
    const ctrl = new AbortController();
    const timeoutId = setTimeout(()=>ctrl.abort(), 3200);
    const res = await fetch(ddgUrl, { signal: ctrl.signal });
    clearTimeout(timeoutId);
    if(res.ok){
      const data = await res.json();
      if(data.AbstractText){
        return {
          source: 'DuckDuckGo Instant Answers',
          title: data.Heading || clean,
          url: data.AbstractURL,
          extract: data.AbstractText
        };
      }
    }
  }catch(e){}

  return null;
}

function auditSystemContrast(){
  const bg = S.theme && THEMES[S.theme] ? THEMES[S.theme].bg : '#FFFFFF';
  const ink = S.theme && THEMES[S.theme] ? THEMES[S.theme].ink : '#111318';
  const results = [];
  (S.colors || []).forEach(c => {
    const ratioBg = ctr(c.h, bg);
    const ratioInk = ctr(c.h, ink);
    const bestRatio = Math.max(ratioBg, ratioInk);
    let grade = 'fail', label = 'Fail (<3.0)';
    if(bestRatio >= 7.0){ grade = 'aaa'; label = 'WCAG AAA (7.0+)'; }
    else if(bestRatio >= 4.5){ grade = 'aa'; label = 'WCAG AA (4.5+)'; }
    else if(bestRatio >= 3.0){ grade = 'aa'; label = 'Large text (3.0+)'; }
    results.push({ name: c.n, hex: c.h, role: c.p, ratio: bestRatio.toFixed(2), grade, label });
  });
  return results;
}

function autoFixContrast(){
  const bg = S.theme && THEMES[S.theme] ? THEMES[S.theme].bg : '#FFFFFF';
  const isLightBg = lum(bg) > 0.5;
  (S.colors || []).forEach(c => {
    let hex = c.h;
    let ratio = ctr(hex, bg);
    let attempts = 0;
    while(ratio < 4.5 && attempts < 15){
      attempts++;
      hex = mix(hex, isLightBg ? '#0A0A0C' : '#FFFFFF', 0.82);
      ratio = ctr(hex, bg);
    }
    c.h = hex;
  });
  pushH(); syncAll(); render();
  toast('Contrast optimized across palette to meet WCAG standards!', 'ok', 3000);
}

async function handleCopilotQuery(promptText){
  const lower = promptText.toLowerCase().trim();
  const host = $('#cpMessages');
  if(!host) return;

  // Add user bubble
  const userMsg = document.createElement('div');
  userMsg.className = 'cp-msg user';
  userMsg.innerHTML = '<div class="cp-bubble">' + esc(promptText) + '</div>';
  host.appendChild(userMsg);

  // Add loading placeholder
  const loadMsg = document.createElement('div');
  loadMsg.className = 'cp-msg ai';
  loadMsg.innerHTML = '<div class="cp-bubble" style="display:flex;align-items:center;gap:8px;color:var(--mut)"><span class="ic sm"><i data-lucide="loader-2"></i></span><span>Synthesizing design intelligence...</span></div>';
  host.appendChild(loadMsg);
  icons();
  host.scrollTop = host.scrollHeight;

  // 1. Accessibility / Contrast check
  if(/contrast|wcag|accessible|accessibility|ratio/.test(lower)){
    const audit = auditSystemContrast();
    let hasFail = audit.some(a => a.grade === 'fail');
    let rowsHtml = audit.map(a => 
      '<div class="cp-audit-row">' +
        '<span><b>' + esc(a.name) + '</b> (' + esc(a.hex) + ')</span>' +
        '<span class="cp-audit-badge ' + a.grade + '">' + esc(a.label) + ' · ' + a.ratio + ':1</span>' +
      '</div>'
    ).join('');

    let cardHtml = 
      '<div class="cp-audit-card">' +
        '<div style="font-weight:700;font-size:12px;color:var(--ink)">Color Palette Accessibility Report</div>' +
        rowsHtml +
        (hasFail ? '<button class="btn p" style="margin-top:6px;height:30px;font-size:12px" onclick="autoFixContrast()"><span class="ic sm"><i data-lucide="sparkles"></i></span>Auto-Fix Failing Contrast</button>' : '<div style="color:var(--emer);font-size:11.5px;font-weight:600">✓ All colors satisfy WCAG contrast criteria!</div>') +
      '</div>';

    loadMsg.innerHTML = 
      '<div class="cp-bubble">' +
        '<p>I evaluated your active brand color palette against WCAG 2.1 contrast algorithms for light and dark contexts.</p>' +
        cardHtml +
      '</div>';
    icons();
    host.scrollTop = host.scrollHeight;
    return;
  }

  // 2. Web search check
  let webData = null;
  const searchMatch = promptText.match(/(?:research|search (?:the )?web (?:for)?|find (?:out )?about|look up|trends in|history of|what is|tell me about)\s+([a-zA-Z0-9\s\-]+)/i);
  let webTopic = searchMatch ? searchMatch[1].trim() : null;
  if(!webTopic && /bauhaus|swiss style|brutalism|de stijl|dieter rams|wabi-sabi|art deco/.test(lower)){
    const m = lower.match(/(bauhaus|swiss style|brutalism|de stijl|dieter rams|wabi-sabi|art deco)/);
    if(m) webTopic = m[1];
  }
  if(webTopic){
    webData = await fetchWebIntelligence(webTopic);
  }

  // 3. Match or synthesize brand profile
  let presetKey = 'coffee';
  if(/luxury|perfume|fragrance|cosmetic|jewelry|watch|haute|fashion/.test(lower)) presetKey = 'luxury';
  else if(/fintech|bank|crypto|wealth|invest|finance|hedge|prime/.test(lower)) presetKey = 'fintech';
  else if(/gaming|esport|cyberpunk|arcade|neon|vortex|hardware/.test(lower)) presetKey = 'cyberpunk';
  else if(/architect|interior|nordic|timber|spatial|building|civic/.test(lower)) presetKey = 'architecture';
  else if(/climate|eco|green|sustain|circular|recycle|earth/.test(lower)) presetKey = 'climate';
  else if(/coffee|café|bakery|bread|tea|food|restaurant|dining/.test(lower)) presetKey = 'coffee';
  else presetKey = 'coffee';

  const base = CP_DB[presetKey];
  const actId = 'act_' + (++CP_ACT_ID);

  // Check if user specified custom brand name
  let customName = null;
  const nameMatch = promptText.match(/(?:called|name(?:d)?|brand)\s+['"]?([a-zA-Z0-9\s&]+?)['"]?(?:\s+(?:with|in|for|that|and)|$)/i);
  if(nameMatch) customName = nameMatch[1].trim();

  // Check custom theme
  let customTheme = null;
  const allThemes = ['swiss','editorial','brutalist','warm','corporate','luxury','technical','playful'];
  allThemes.forEach(t => { if(lower.indexOf(t) >= 0) customTheme = t; });

  const payload = {
    name: customName || base.name,
    tagline: base.tagline,
    desc: base.desc,
    theme: customTheme || base.theme,
    hf: base.hf,
    bf: base.bf,
    colors: base.colors,
    tone: base.tone,
    mission: base.mission,
    vision: base.vision,
    values: base.values,
    dos: base.dos,
    donts: base.donts
  };

  CP_ACTIONS[actId] = payload;

  const swatchesHtml = payload.colors.map(c => 
    '<div class="cp-swatch" style="background:' + c.h + '" data-h="' + c.h + ' (' + esc(c.n) + ')" title="' + esc(c.n) + ' · ' + c.h + '"></div>'
  ).join('');

  const webRefHtml = webData ? 
    '<div class="cp-web-ref">' +
      '<div class="cp-web-ref-head"><span class="ic xs"><i data-lucide="globe"></i></span> ' + esc(webData.source) + ' · ' + esc(webData.title) + '</div>' +
      '<div>' + esc(webData.extract.length > 240 ? webData.extract.slice(0, 240) + '…' : webData.extract) + '</div>' +
      (webData.url ? '<a href="' + esc(webData.url) + '" target="_blank" rel="noopener" style="color:var(--blueDeep);font-weight:600;margin-top:2px;text-decoration:underline">Read web source ↗</a>' : '') +
    '</div>' : '';

  const actionCardHtml = 
    '<div class="cp-action-card">' +
      '<div class="cp-act-head">' +
        '<span class="cp-act-name">' + esc(payload.name) + '</span>' +
        '<span class="cp-act-theme">' + esc(THEMES[payload.theme] ? THEMES[payload.theme].n : payload.theme) + ' Theme</span>' +
      '</div>' +
      '<div class="cp-act-specs">' +
        '<div><b>Headline Font</b> ' + esc(payload.hf) + '</div>' +
        '<div><b>Body Font</b> ' + esc(payload.bf) + '</div>' +
        '<div style="grid-column:1/-1"><b>Tagline</b> <i>"' + esc(payload.tagline) + '"</i></div>' +
      '</div>' +
      '<div>' +
        '<div style="font-size:10px;font-weight:600;color:var(--mut);text-transform:uppercase;margin-bottom:3px">Color Palette (5 Harmonies)</div>' +
        '<div class="cp-swatches">' + swatchesHtml + '</div>' +
      '</div>' +
      '<div class="cp-act-btns">' +
        '<button class="btn p cp-apply-btn" data-act="' + actId + '" onclick="applyCopilotAction(\'' + actId + '\')"><span class="ic sm"><i data-lucide="sparkles"></i></span>Apply to BrandBook</button>' +
      '</div>' +
    '</div>';

  loadMsg.innerHTML = 
    '<div class="cp-bubble">' +
      '<p>I crafted a comprehensive design system tailored to your creative direction. Everything operates 100% in-browser with zero external AI subscriptions.</p>' +
      webRefHtml +
      actionCardHtml +
    '</div>';

  icons();
  host.scrollTop = host.scrollHeight;
}

function initCopilot(){
  const btn = $('#copilotBtn');
  if(btn) btn.onclick = () => toggleCopilot();

  const closeBtn = $('#cpClose');
  if(closeBtn) closeBtn.onclick = () => toggleCopilot(false);

  const clearBtn = $('#cpClear');
  if(clearBtn) clearBtn.onclick = () => {
    const host = $('#cpMessages');
    if(host){
      host.innerHTML = '';
      showWelcomeCopilot();
    }
  };

  const sendBtn = $('#cpSend');
  const inp = $('#cpInput');
  const doSend = () => {
    if(!inp) return;
    const txt = inp.value.trim();
    if(!txt) return;
    inp.value = '';
    handleCopilotQuery(txt);
  };
  if(sendBtn) sendBtn.onclick = doSend;
  if(inp){
    inp.addEventListener('keydown', e => {
      if(e.key === 'Enter' && !e.shiftKey){
        e.preventDefault();
        doSend();
      }
    });
  }

  // Bind quick chip buttons
  $$('#cpChips .cp-chip').forEach(ch => {
    ch.onclick = () => {
      const q = ch.dataset.q;
      if(q){
        toggleCopilot(true);
        handleCopilotQuery(q);
      }
    };
  });

  showWelcomeCopilot();
}

    e.preventDefault();if(e.dataTransfer.files&&e.dataTransfer.files[0])loadImg(el.dataset.img||el.dataset.pick,e.dataTransfer.files[0])});
  document.addEventListener('dblclick',e=>{
    const el=e.target.closest('.t.ed');if(!el)return;
    const tid=el.dataset.tid,si=+el.dataset.sl;if(!tid||isNaN(si))return;
    e.stopPropagation();
    el.contentEditable='true';el.classList.add('ing');el.focus();
    const r=document.createRange();r.selectNodeContents(el);
    const sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);
    const done=()=>{el.contentEditable='false';el.classList.remove('ing');
      if(!OV[si])OV[si]={};if(!OV[si].customTexts)OV[si].customTexts={};
      OV[si].customTexts[tid]=el.textContent;pushH();render();toast('Text updated','ok',1200)};
    el.addEventListener('blur',done,{once:true});
    el.addEventListener('keydown',ev=>{
      if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();el.blur()}
      if(ev.key==='Escape'){const d=deck();const it=d[si]&&d[si].items.find(x=>x.id===tid);if(it)el.textContent=it.t;el.blur()}})});
  document.addEventListener('keydown',e=>{
    const tag=(e.target.tagName||'').toLowerCase();
    const typing=tag==='input'||tag==='textarea'||e.target.isContentEditable;
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='j'){e.preventDefault();toggleCopilot();return}
    if(e.key==='Escape'&&isCopilotOpen()){e.preventDefault();toggleCopilot(false);return}
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCmd();return}
    if(e.key==='Escape'&&!typing&&!POP.el)deselect();
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!typing){e.preventDefault();e.shiftKey?redo():undo()}
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'&&!typing){e.preventDefault();redo()}
    if(!typing&&V.mode==='one'){if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)}});
}

/* ═══════════ INIT ═══════════ */
(function(){
  try{
    buildSidebar();buildDB();mountAll();bind();initCopilot();
    loadFont(S.hf);loadFont(S.bf);
    syncAll();pushH();render();inspector();icons();
    loadIconSet().then(render);
    toast(deck().length+' slides ready — click a slide to edit it, or press Ctrl K','info',4800);
  }catch(err){
    console.error(err);
    document.body.innerHTML='<div style="padding:40px;font-family:Inter,sans-serif"><h2>Startup error</h2><pre style="background:#f4f4f5;padding:16px;border-radius:8px;white-space:pre-wrap">'+esc(err.message+'\n'+err.stack)+'</pre></div>';
  }
})();
</script>
